pre-commit:
  commands:
    biome:
      run: pnpm exec biome check --write --staged --no-errors-on-unmatched
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    quality:
      run: pnpm test:pre-push
    workflows:
      glob: ".github/workflows/*.{yml,yaml}"
      run: pnpm lint:workflows
