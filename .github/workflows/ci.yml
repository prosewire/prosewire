name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
    inputs:
      version_pr:
        description: Version PR number supplied by trusted release automation
        required: false
  pull_request:
  push:
    branches: [main]

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Validate an automated Changesets version-PR dispatch.
    outputs:
      base_sha: ${{ steps.changes.outputs.base_sha }}
      head_sha: ${{ steps.changes.outputs.head_sha }}
      dependency_audit: ${{ steps.changes.outputs.dependency_audit }}
      edge_image: ${{ steps.changes.outputs.edge_image }}
      full_quality: ${{ steps.changes.outputs.full_quality }}
      integration: ${{ steps.changes.outputs.integration }}
      package_release: ${{ steps.changes.outputs.package_release }}
      package_smoke: ${{ steps.changes.outputs.package_smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the event SHA range
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          GH_TOKEN: ${{ inputs.version_pr != '' && github.token || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION_PR: ${{ inputs.version_pr || '' }}
        run: |
          event_name="$GITHUB_EVENT_NAME"
          if [ -n "$VERSION_PR" ]; then
            test "$event_name" = "workflow_dispatch"
            [[ "$VERSION_PR" =~ ^[0-9]+$ ]]
            pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$VERSION_PR")"
            test "$(jq -r .state <<<"$pull")" = "open"
            test "$(jq -r .base.ref <<<"$pull")" = "main"
            test "$(jq -r .head.repo.full_name <<<"$pull")" = "$GITHUB_REPOSITORY"
            test "$(jq -r .head.sha <<<"$pull")" = "$GITHUB_SHA"
            BASE_SHA="$(jq -r .base.sha <<<"$pull")"
            HEAD_SHA="$(jq -r .head.sha <<<"$pull")"
            event_name="pull_request"
          fi
          node scripts/ci-change-classifier.mjs \
            "$event_name" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_OUTPUT"

  quality:
    name: CI quality
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Check changed files with Biome
        if: needs.classify.outputs.base_sha != ''
        env:
          BIOME_BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: pnpm exec biome ci --changed --since="$BIOME_BASE_SHA"
      - name: Check manually dispatched branch changes with Biome
        if: needs.classify.outputs.base_sha == ''
        run: pnpm exec biome ci --changed --since=origin/main
      - name: Lint workflows
        if: needs.classify.outputs.full_quality == 'true'
        run: pnpm lint:workflows
      - name: Test change classification
        run: node --test scripts/ci-change-classifier.test.mjs
      - name: Check all workspace types
        if: needs.classify.outputs.full_quality == 'true'
        run: pnpm typecheck
      - name: Check affected workspace types
        if: needs.classify.outputs.full_quality != 'true'
        env:
          TURBO_SCM_BASE: ${{ needs.classify.outputs.base_sha }}
          TURBO_SCM_HEAD: ${{ needs.classify.outputs.head_sha }}
        run: pnpm exec turbo run typecheck --affected
      - name: Test all workspaces with coverage
        if: needs.classify.outputs.full_quality == 'true'
        run: pnpm test:coverage
      - name: Test affected workspaces with coverage
        if: needs.classify.outputs.full_quality != 'true'
        env:
          TURBO_SCM_BASE: ${{ needs.classify.outputs.base_sha }}
          TURBO_SCM_HEAD: ${{ needs.classify.outputs.head_sha }}
        run: pnpm exec turbo run test:coverage --affected
      - name: Smoke-test affected package tarballs
        if: needs.classify.outputs.package_smoke != ''
        env:
          PACKAGE_SMOKE: ${{ needs.classify.outputs.package_smoke }}
        run: node scripts/package-tarball-smoke.mjs --packages="$PACKAGE_SMOKE"

  runtime-integration:
    name: Runtime integration
    needs: classify
    if: needs.classify.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: prosewire_acceptance
          POSTGRES_USER: prosewire
          POSTGRES_PASSWORD: prosewire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prosewire -d prosewire_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://prosewire:prosewire@localhost:5432/prosewire_acceptance
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      PROSEWIRE_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_PROSEWIRE_PUBLIC_URL: http://localhost:3000
      PROSEWIRE_EXPOSE_TESTING_API: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:database
      - run: pnpm build
      - run: pnpm --filter @prosewire/web exec playwright install --with-deps chromium
      - run: pnpm test:acceptance
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          cache-from: type=gha,scope=prosewire-ci-image
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=prosewire-ci-image' || '' }}
          tags: prosewire:ci
      - run: scripts/container-runtime-smoke.sh prosewire:ci
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: CI integration
    needs: [classify, quality, runtime-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report required integration result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_REQUIRED: ${{ needs.classify.outputs.integration }}
          RUNTIME_RESULT: ${{ needs.runtime-integration.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          if [ "$INTEGRATION_REQUIRED" = "true" ]; then
            test "$QUALITY_RESULT" = "success"
            test "$RUNTIME_RESULT" = "success"
            echo "Required runtime integration passed."
          else
            test "$RUNTIME_RESULT" = "skipped"
            echo "Runtime integration was not relevant to this change."
          fi

  secret-history:
    name: Secret history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/secret-scan.sh

  lockfile-audit:
    name: Lockfile dependency audit
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate change classification
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
        run: test "$CLASSIFY_RESULT" = "success"
      - name: Explain skipped dependency audit
        if: needs.classify.outputs.dependency_audit != 'true'
        run: echo "Dependency inputs did not change."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.dependency_audit == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: needs.classify.outputs.dependency_audit == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.classify.outputs.dependency_audit == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: needs.classify.outputs.dependency_audit == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.classify.outputs.dependency_audit == 'true'
        run: pnpm audit:prod

  dispatch-package-release:
    name: Dispatch package release
    needs: [classify, quality, integration, secret-history, lockfile-audit]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.classify.outputs.package_release == 'true' &&
      needs.classify.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.secret-history.result == 'success' &&
      needs.lockfile-audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # Dispatch the trusted-publishing workflow after every gate passes.
      contents: read
    steps:
      - name: Dispatch the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run release.yml --ref main
          -f sha="$GITHUB_SHA"
          -f run_id="$GITHUB_RUN_ID"

  edge-image:
    name: Publish edge image
    needs: [classify, quality, integration, secret-history, lockfile-audit]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.classify.outputs.edge_image == 'true' &&
      needs.classify.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.secret-history.result == 'success' &&
      needs.lockfile-audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: prosewire-edge-image
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write # Push and promote the verified edge image in GHCR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve edge candidate
        id: release
        run: |
          short_sha="${GITHUB_SHA::12}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="$image:edge-sha-$short_sha"
          {
            echo "image=$image"
            echo "candidate=$candidate"
            if output="$(docker buildx imagetools inspect "$candidate" 2>/dev/null)"; then
              digest="$(awk '/^Digest:/ { print $2; exit }' <<<"$output")"
              test -n "$digest"
              echo "candidate_exists=true"
              echo "candidate_digest=$digest"
            else
              echo "candidate_exists=false"
            fi
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.release.outputs.candidate_exists != 'true'
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=prosewire-ci-image
          cache-to: type=gha,mode=max,scope=prosewire-ci-image
          sbom: true
          provenance: mode=max
          tags: ${{ steps.release.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Capture candidate digest
        id: digest
        env:
          EXISTING_DIGEST: ${{ steps.release.outputs.candidate_digest }}
          PUSHED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$PUSHED_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not produce a valid digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify edge candidate
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          reference="$IMAGE@$DIGEST"
          node scripts/verify-image-manifest.mjs "$reference" "$GITHUB_SHA" "$SOURCE" linux/amd64
          docker pull --platform linux/amd64 "$reference"
          docker run --rm --entrypoint /bin/sh "$reference" -ec '
            test -f /app/apps/web/server.js
            test -f /app/apps/worker/dist/index.mjs
            test -f /app/apps/worker/dist/migrate.mjs
            test -f /app/packages/db/drizzle/meta/_journal.json
          '
      - name: Verify anonymous edge pull
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: scripts/verify-anonymous-image-pull.sh "$IMAGE@$DIGEST" linux/amd64
      - name: Promote verified edge tag
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:edge" "$IMAGE@$DIGEST"
          actual="$(docker buildx imagetools inspect "$IMAGE:edge" | awk '/^Digest:/ { print $2; exit }')"
          test "$actual" = "$DIGEST"
          echo "Verified and promoted $IMAGE@$DIGEST to edge."
