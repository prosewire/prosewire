name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prosewire_acceptance
          POSTGRES_USER: prosewire
          POSTGRES_PASSWORD: prosewire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prosewire -d prosewire_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://prosewire:prosewire@localhost:5432/prosewire_acceptance
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      PROSEWIRE_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_PROSEWIRE_PUBLIC_URL: http://localhost:3000
      PROSEWIRE_EXPOSE_TESTING_API: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:packages
      - run: pnpm build
      - run: pnpm --filter @prosewire/web exec playwright install --with-deps chromium
      - run: pnpm test:acceptance
      - run: docker build --tag prosewire:ci .
