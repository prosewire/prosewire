name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prosewire
          POSTGRES_USER: prosewire
          POSTGRES_PASSWORD: prosewire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prosewire -d prosewire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://prosewire:prosewire@localhost:5432/prosewire
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      PROSEWIRE_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_PROSEWIRE_PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build --tag prosewire:ci .
