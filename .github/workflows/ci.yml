name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - name: Check changed files with Biome
        if: github.event_name != 'workflow_dispatch'
        env:
          BIOME_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm exec biome ci --changed --since="$BIOME_BASE_SHA"
      - name: Check all files with Biome
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec biome ci .
      - run: pnpm lint:workflows
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:packages

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: prosewire_acceptance
          POSTGRES_USER: prosewire
          POSTGRES_PASSWORD: prosewire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prosewire -d prosewire_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://prosewire:prosewire@localhost:5432/prosewire_acceptance
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      PROSEWIRE_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_PROSEWIRE_PUBLIC_URL: http://localhost:3000
      PROSEWIRE_EXPOSE_TESTING_API: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:database
      - run: pnpm build
      - run: pnpm --filter @prosewire/web exec playwright install --with-deps chromium
      - run: pnpm test:acceptance
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          cache-from: type=gha,scope=prosewire-ci-image
          cache-to: type=gha,mode=max,scope=prosewire-ci-image
          tags: prosewire:ci
      - run: scripts/container-runtime-smoke.sh prosewire:ci
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
