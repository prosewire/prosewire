name: Release image

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/worker/**
      - packages/config/**
      - packages/contract/**
      - packages/core/**
      - packages/db/**
      - packages/jobs/**
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .npmrc
      - .pnpmfile.cjs
      - patches/**
      - "!**/*.md"
      - "!**/*.mdx"
      - "!**/*.test.*"
      - "!**/*.spec.*"
      - "!apps/web/acceptance/**"
      - "!apps/web/playwright.config.ts"
  workflow_dispatch:
    inputs:
      version:
        description: Plain semver version
        required: true
      ref:
        description: Immutable commit contained in main
        required: true

permissions: {}

concurrency:
  group: release-image-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  source:
    name: Resolve image source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit-sha: ${{ steps.release.outputs.commit_sha }}
      edge-required: ${{ steps.release.outputs.edge_required }}
      image: ${{ steps.release.outputs.image }}
      previous-tag: ${{ steps.release.outputs.previous_tag }}
      short-sha: ${{ steps.release.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate the release source
        id: release
        env:
          BASE_SHA: ${{ github.event.before || '' }}
          PUSH_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ inputs.ref || '' }}
          VERSION: ${{ inputs.version || '' }}
        run: |
          commit_sha="$(git rev-parse HEAD)"
          previous_tag=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version must be plain semver, for example 1.2.3" >&2
              exit 1
            fi
            if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "ref must be a full 40-character commit SHA" >&2
              exit 1
            fi
            test "$commit_sha" = "$RELEASE_REF"
            git fetch origin main:refs/remotes/origin/main --tags
            if ! git merge-base --is-ancestor "$commit_sha" origin/main; then
              echo "$commit_sha is not contained in main" >&2
              exit 1
            fi
            node -e '
              const fs = require("node:fs");
              const expected = process.env.VERSION;
              const root = JSON.parse(fs.readFileSync("package.json")).version;
              const source = fs.readFileSync("apps/web/src/server/version.ts", "utf8");
              if (root !== expected) throw new Error("root version is " + root + ", expected " + expected);
              if (!source.includes("export const version = \"" + expected + "\";")) {
                throw new Error("web health version does not match the image version");
              }
            '
            previous_tag="$(
              git tag --merged "$commit_sha" --list 'v*' |
                awk -v current="v$VERSION" '$0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != current' |
                sort -V |
                tail -1
            )"
            echo "edge_required=false" >> "$GITHUB_OUTPUT"
          else
            test "$commit_sha" = "$PUSH_SHA"
            node scripts/edge-image-change.mjs "$BASE_SHA" "$commit_sha" "$GITHUB_OUTPUT"
          fi
          {
            echo "commit_sha=$commit_sha"
            echo "short_sha=$(git rev-parse --short=12 HEAD)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  tests:
    name: Test image source
    needs: source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.source.outputs.edge-required == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.source.outputs.commit-sha }}

  edge:
    name: Publish edge image
    needs: [source, tests]
    if: >-
      github.event_name == 'push' &&
      needs.source.outputs.edge-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve edge candidate
        id: registry
        env:
          IMAGE: ${{ needs.source.outputs.image }}
          SHORT_SHA: ${{ needs.source.outputs.short-sha }}
        run: |
          candidate="$IMAGE:edge-sha-$SHORT_SHA"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          if output="$(docker buildx imagetools inspect "$candidate" 2>/dev/null)"; then
            digest="$(awk '/^Digest:/ { print $2; exit }' <<<"$output")"
            test -n "$digest"
            echo "candidate_exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.registry.outputs.candidate_exists != 'true'
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=prosewire-image
          cache-to: type=gha,mode=max,scope=prosewire-image
          sbom: true
          provenance: mode=max
          tags: ${{ steps.registry.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.commit-sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Capture edge digest
        id: digest
        env:
          EXISTING_DIGEST: ${{ steps.registry.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$PUSHED_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not produce a valid digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify edge candidate
        env:
          IMAGE: ${{ needs.source.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          REVISION: ${{ needs.source.outputs.commit-sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          reference="$IMAGE@$DIGEST"
          node scripts/verify-image-manifest.mjs "$reference" "$REVISION" "$SOURCE" linux/amd64
          scripts/verify-image-runtime-files.sh "$reference" linux/amd64
          scripts/container-runtime-smoke.sh "$reference"
      - name: Verify anonymous edge pull
        env:
          IMAGE: ${{ needs.source.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: scripts/verify-anonymous-image-pull.sh "$IMAGE@$DIGEST" linux/amd64
      - name: Promote verified edge tag
        env:
          IMAGE: ${{ needs.source.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:edge" "$IMAGE@$DIGEST"
          actual="$(docker buildx imagetools inspect "$IMAGE:edge" | awk '/^Digest:/ { print $2; exit }')"
          test "$actual" = "$DIGEST"
          echo "Promoted verified digest $DIGEST to edge."

  stable:
    name: Publish stable image
    needs: [source, tests]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: stable-release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve stable release
        id: registry
        env:
          COMMIT_SHA: ${{ needs.source.outputs.commit-sha }}
          IMAGE: ${{ needs.source.outputs.image }}
          VERSION: ${{ inputs.version }}
          SHORT_SHA: ${{ needs.source.outputs.short-sha }}
        run: |
          git fetch origin main:refs/remotes/origin/main --tags
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "$COMMIT_SHA is no longer contained in main" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            tagged_sha="$(git rev-list -n 1 "v$VERSION")"
            if [ "$tagged_sha" != "$COMMIT_SHA" ]; then
              echo "v$VERSION already points to $tagged_sha, not $COMMIT_SHA" >&2
              exit 1
            fi
          fi
          newest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)"
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "v$VERSION is older than existing stable release v$newest and cannot become latest" >&2
            exit 1
          fi
          stable="$IMAGE:v$VERSION"
          candidate="$IMAGE:stable-sha-$SHORT_SHA"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          if output="$(docker buildx imagetools inspect "$stable" 2>/dev/null)"; then
            digest="$(awk '/^Digest:/ { print $2; exit }' <<<"$output")"
            test -n "$digest"
            echo "stable_exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "stable_exists=false" >> "$GITHUB_OUTPUT"
            if output="$(docker buildx imagetools inspect "$candidate" 2>/dev/null)"; then
              digest="$(awk '/^Digest:/ { print $2; exit }' <<<"$output")"
              test -n "$digest"
              echo "candidate_exists=true" >> "$GITHUB_OUTPUT"
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
            else
              echo "candidate_exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.registry.outputs.stable_exists != 'true' && steps.registry.outputs.candidate_exists != 'true'
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=prosewire-image
          cache-to: type=gha,mode=max,scope=prosewire-image
          sbom: true
          provenance: mode=max
          tags: ${{ steps.registry.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.commit-sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Capture stable digest
        id: digest
        env:
          EXISTING_DIGEST: ${{ steps.registry.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$PUSHED_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not produce a valid digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify stable candidate
        env:
          IMAGE: ${{ needs.source.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          REVISION: ${{ needs.source.outputs.commit-sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          reference="$IMAGE@$DIGEST"
          node scripts/verify-image-manifest.mjs "$reference" "$REVISION" "$SOURCE" linux/amd64 linux/arm64
          scripts/verify-image-runtime-files.sh "$reference" linux/amd64 linux/arm64
          scripts/container-runtime-smoke.sh "$reference"
      - name: Verify anonymous stable pull
        env:
          IMAGE: ${{ needs.source.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: scripts/verify-anonymous-image-pull.sh "$IMAGE@$DIGEST" linux/amd64
      - name: Create immutable Git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ needs.source.outputs.commit-sha }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/v$VERSION" \
              -f sha="$COMMIT_SHA"
          fi
      - name: Promote verified stable image tags
        env:
          IMAGE: ${{ needs.source.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          reference="$IMAGE@$DIGEST"
          docker buildx imagetools create \
            --tag "$IMAGE:v$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$reference"
          for tag in "v$VERSION" "$VERSION" latest; do
            actual="$(docker buildx imagetools inspect "$IMAGE:$tag" | awk '/^Digest:/ { print $2; exit }')"
            if [ "$actual" != "$DIGEST" ]; then
              echo "$IMAGE:$tag resolved to $actual, expected $DIGEST" >&2
              exit 1
            fi
          done
          echo "Promoted verified digest $DIGEST."
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ needs.source.outputs.previous-tag }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            release_args=(
              "v$VERSION"
              --title "Prosewire v$VERSION"
              --generate-notes
              --verify-tag
              --fail-on-no-commits
            )
            if [ -n "$PREVIOUS_TAG" ]; then
              release_args+=(--notes-start-tag "$PREVIOUS_TAG")
            fi
            gh release create "${release_args[@]}"
          fi
