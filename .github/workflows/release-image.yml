name: Release image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Plain semver version
        required: true
      ref:
        description: Immutable commit contained in origin/main
        required: true

permissions: {}

jobs:
  edge:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: prosewire-edge-image
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      EDGE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve edge candidate
        id: release
        run: |
          short_sha="${EDGE_SHA::12}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="$image:edge-sha-$short_sha"
          {
            echo "short_sha=$short_sha"
            echo "image=$image"
            echo "candidate=$candidate"
            if output="$(docker buildx imagetools inspect "$candidate" 2>/dev/null)"; then
              digest="$(awk '/^Digest:/ { print $2; exit }' <<<"$output")"
              test -n "$digest"
              echo "candidate_exists=true"
              echo "candidate_digest=$digest"
            else
              echo "candidate_exists=false"
            fi
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.release.outputs.candidate_exists != 'true'
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=prosewire-ci-image
          cache-to: type=gha,mode=max,scope=prosewire-ci-image
          sbom: true
          provenance: mode=max
          tags: ${{ steps.release.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ env.EDGE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Capture candidate digest
        id: digest
        env:
          EXISTING_DIGEST: ${{ steps.release.outputs.candidate_digest }}
          PUSHED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$PUSHED_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not produce a valid digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify edge candidate
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          reference="$IMAGE@$DIGEST"
          node scripts/verify-image-manifest.mjs "$reference" "$EDGE_SHA" "$SOURCE" linux/amd64
          docker pull --platform linux/amd64 "$reference"
          docker run --rm --entrypoint /bin/sh "$reference" -ec '
            test -f /app/apps/web/server.js
            test -f /app/apps/worker/dist/index.mjs
            test -f /app/apps/worker/dist/migrate.mjs
            test -f /app/packages/db/drizzle/meta/_journal.json
          '
      - name: Verify anonymous edge pull
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: scripts/verify-anonymous-image-pull.sh "$IMAGE@$DIGEST" linux/amd64
      - name: Promote verified edge tag
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:edge" "$IMAGE@$DIGEST"
          actual="$(docker buildx imagetools inspect "$IMAGE:edge" | awk '/^Digest:/ { print $2; exit }')"
          test "$actual" = "$DIGEST"
          echo "Verified and promoted $IMAGE@$DIGEST to edge."

  validate-stable:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit-sha: ${{ steps.release.outputs.commit_sha }}
      short-sha: ${{ steps.release.outputs.short_sha }}
      image: ${{ steps.release.outputs.image }}
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: prosewire_acceptance
          POSTGRES_USER: prosewire
          POSTGRES_PASSWORD: prosewire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prosewire -d prosewire_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://prosewire:prosewire@localhost:5432/prosewire_acceptance
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: release-ci-only-secret-with-at-least-32-characters
      PROSEWIRE_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_PROSEWIRE_PUBLIC_URL: http://localhost:3000
      PROSEWIRE_EXPOSE_TESTING_API: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable release source
        id: release
        env:
          RELEASE_REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be plain semver (for example, 1.2.3)" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref must be a full 40-character commit SHA" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --tags
          commit_sha="$(git rev-parse HEAD)"
          test "$commit_sha" = "$RELEASE_REF"
          if ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo "$commit_sha is not contained in origin/main" >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const expected = process.env.VERSION;
            const root = JSON.parse(fs.readFileSync("package.json")).version;
            const source = fs.readFileSync("apps/web/src/server/version.ts", "utf8");
            if (root !== expected) throw new Error("root version is " + root + ", expected " + expected);
            if (!source.includes("export const version = \"" + expected + "\";")) {
              throw new Error("web health version does not match the image version");
            }
          '
          {
            echo "commit_sha=$commit_sha"
            echo "short_sha=$(git rev-parse --short=12 HEAD)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm db:migrate
      - run: pnpm exec biome ci .
      - run: pnpm lint:workflows
      - run: pnpm scan:secrets
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm --filter @prosewire/web exec playwright install --with-deps chromium
      - run: pnpm test:acceptance
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  stable:
    needs: validate-stable
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: stable-release
    concurrency:
      group: prosewire-stable-image
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-stable.outputs.commit-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve stable release
        id: registry
        env:
          COMMIT_SHA: ${{ needs.validate-stable.outputs.commit-sha }}
          IMAGE: ${{ needs.validate-stable.outputs.image }}
          VERSION: ${{ inputs.version }}
          SHORT_SHA: ${{ needs.validate-stable.outputs.short-sha }}
        run: |
          git fetch origin main:refs/remotes/origin/main --tags
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "$COMMIT_SHA is no longer contained in origin/main" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            tagged_sha="$(git rev-list -n 1 "v$VERSION")"
            if [ "$tagged_sha" != "$COMMIT_SHA" ]; then
              echo "v$VERSION already points to $tagged_sha, not $COMMIT_SHA" >&2
              exit 1
            fi
          fi
          newest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)"
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "v$VERSION is older than existing stable release v$newest and cannot become latest" >&2
            exit 1
          fi
          stable="$IMAGE:v$VERSION"
          candidate="$IMAGE:stable-sha-$SHORT_SHA"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          if output="$(docker buildx imagetools inspect "$stable" 2>/dev/null)"; then
            digest="$(awk '/^Digest:/ { print $2; exit }' <<<"$output")"
            test -n "$digest"
            echo "stable_exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "stable_exists=false" >> "$GITHUB_OUTPUT"
            if output="$(docker buildx imagetools inspect "$candidate" 2>/dev/null)"; then
              digest="$(awk '/^Digest:/ { print $2; exit }' <<<"$output")"
              test -n "$digest"
              echo "candidate_exists=true" >> "$GITHUB_OUTPUT"
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
            else
              echo "candidate_exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.registry.outputs.stable_exists != 'true' && steps.registry.outputs.candidate_exists != 'true'
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=prosewire-ci-image
          cache-to: type=gha,mode=max,scope=prosewire-ci-image
          sbom: true
          provenance: mode=max
          tags: ${{ steps.registry.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate-stable.outputs.commit-sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Capture stable digest
        id: digest
        env:
          EXISTING_DIGEST: ${{ steps.registry.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$PUSHED_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not produce a valid digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify multi-platform artifact
        env:
          IMAGE: ${{ needs.validate-stable.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          REVISION: ${{ needs.validate-stable.outputs.commit-sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          reference="$IMAGE@$DIGEST"
          node scripts/verify-image-manifest.mjs "$reference" "$REVISION" "$SOURCE" linux/amd64 linux/arm64
          scripts/verify-image-runtime-files.sh "$reference" linux/amd64 linux/arm64
          scripts/container-runtime-smoke.sh "$reference"
      - name: Verify anonymous stable pull
        env:
          IMAGE: ${{ needs.validate-stable.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: scripts/verify-anonymous-image-pull.sh "$IMAGE@$DIGEST" linux/amd64
      - name: Create immutable Git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ needs.validate-stable.outputs.commit-sha }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/v$VERSION" \
              -f sha="$COMMIT_SHA"
          fi
      - name: Promote verified stable image tags
        env:
          IMAGE: ${{ needs.validate-stable.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          reference="$IMAGE@$DIGEST"
          docker buildx imagetools create \
            --tag "$IMAGE:v$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$reference"
          for tag in "v$VERSION" "$VERSION" latest; do
            actual="$(docker buildx imagetools inspect "$IMAGE:$tag" | awk '/^Digest:/ { print $2; exit }')"
            if [ "$actual" != "$DIGEST" ]; then
              echo "$IMAGE:$tag resolved to $actual, expected $DIGEST" >&2
              exit 1
            fi
          done
          echo "Promoted verified digest $DIGEST."
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ needs.validate-stable.outputs.commit-sha }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --target "$COMMIT_SHA" \
              --title "Prosewire v$VERSION" \
              --generate-notes
          fi
