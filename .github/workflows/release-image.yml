name: Release image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Plain semver version
        required: true
      ref:
        description: Immutable source ref
        required: true

permissions: {}

jobs:
  edge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: prosewire-edge-image
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image metadata
        id: release
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.release.outputs.image }}:edge
            ${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Verify published image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          reference="$IMAGE@$DIGEST"
          docker pull "$reference"
          test "$(docker image inspect "$reference" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint /bin/sh "$reference" -ec '
            test -f /app/apps/web/server.js
            test -f /app/apps/worker/dist/index.mjs
            test -f /app/apps/worker/dist/migrate.mjs
            test -d /app/packages/db/drizzle
          '
          echo "Verified $reference"

  stable:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Validate release
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be plain semver (for example, 1.2.3)"
            exit 1
          fi
          commit_sha="$(git rev-parse HEAD)"
          existing_sha="$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)"
          if [[ -n "$existing_sha" && "$existing_sha" != "$commit_sha" ]]; then
            echo "v$VERSION already points to a different commit"
            exit 1
          fi
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.release.outputs.image }}:v${{ inputs.version }}
            ${{ steps.release.outputs.image }}:${{ inputs.version }}
            ${{ steps.release.outputs.image }}:latest
            ${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.short_sha }}
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          if ! git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            git tag "v$VERSION" "$COMMIT_SHA"
            git push origin "v$VERSION"
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$COMMIT_SHA" --title "Prosewire v$VERSION" --generate-notes
          fi
