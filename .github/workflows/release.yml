name: Release packages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prosewire_acceptance
          POSTGRES_USER: prosewire
          POSTGRES_PASSWORD: prosewire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prosewire -d prosewire_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://prosewire:prosewire@localhost:5432/prosewire_acceptance
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: release-ci-only-secret-with-at-least-32-characters
      PROSEWIRE_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_PROSEWIRE_PUBLIC_URL: http://localhost:3000
      PROSEWIRE_EXPOSE_TESTING_API: "1"
      PUBLIC_PACKAGE_DIRECTORIES: sdk cli mcp next astro create-prosewire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm with trusted-publishing support
        run: npm install --global npm@11.6.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm lint:workflows
      - run: pnpm scan:secrets
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:packages
      - run: pnpm build
      - run: pnpm --filter @prosewire/web exec playwright install --with-deps chromium
      - run: pnpm test:acceptance
      - name: Create version pull request or publish packages
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          create-github-releases: false
          push-git-tags: false
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - name: Verify registry versions
        if: steps.changesets.outputs.published == 'true'
        run: |
          for _attempt in {1..12}; do
            ready=true
            while IFS= read -r package_spec; do
              actual="$(npm view "$package_spec" version 2>/dev/null || true)"
              expected="${package_spec##*@}"
              if [ "$actual" != "$expected" ]; then
                ready=false
              fi
            done < <(node -e '
              const fs = require("node:fs");
              for (const directory of process.env.PUBLIC_PACKAGE_DIRECTORIES.split(/\s+/)) {
                const manifest = JSON.parse(fs.readFileSync("packages/" + directory + "/package.json"));
                console.log(manifest.name + "@" + manifest.version);
              }
            ')
            if [ "$ready" = true ]; then
              echo "Verified all public package versions on npm."
              exit 0
            fi
            sleep 5
          done
          echo "Public package versions were not consistently visible on npm" >&2
          exit 1
