name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected version shared by SDK, CLI, and MCP
        required: true
      ref:
        description: Immutable commit contained in origin/main
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-packages-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prosewire_acceptance
          POSTGRES_USER: prosewire
          POSTGRES_PASSWORD: prosewire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prosewire -d prosewire_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://prosewire:prosewire@localhost:5432/prosewire_acceptance
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: release-ci-only-secret-with-at-least-32-characters
      PROSEWIRE_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_PROSEWIRE_PUBLIC_URL: http://localhost:3000
      PROSEWIRE_EXPOSE_TESTING_API: "1"
      PUBLIC_PACKAGE_DIRECTORIES: sdk cli mcp next astro create-prosewire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Validate immutable release source
        env:
          RELEASE_REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be plain semver (for example, 1.2.3)" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref must be a full 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          commit_sha="$(git rev-parse HEAD)"
          test "$commit_sha" = "$RELEASE_REF"
          if ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo "$commit_sha is not contained in origin/main" >&2
            exit 1
          fi
          # JavaScript template literals are intentional.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const directories = process.env.PUBLIC_PACKAGE_DIRECTORIES.split(/\s+/);
            const expected = process.env.VERSION;
            const manifests = new Map();
            for (const directory of directories) {
              const manifest = JSON.parse(fs.readFileSync(`packages/${directory}/package.json`));
              if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) {
                throw new Error(`${manifest.name} has invalid version ${manifest.version}`);
              }
              manifests.set(directory, manifest);
            }
            for (const directory of ["sdk", "cli", "mcp"]) {
              const manifest = manifests.get(directory);
              if (manifest.version !== expected) {
                throw new Error(`${manifest.name} is ${manifest.version}, expected ${expected}`);
              }
            }
            const frameworkVersions = new Set(
              ["next", "astro", "create-prosewire"].map(
                (directory) => manifests.get(directory).version,
              ),
            );
            if (frameworkVersions.size !== 1) {
              throw new Error("Next.js, Astro, and create-prosewire versions are not aligned");
            }
          '
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm with trusted-publishing support
        run: npm install --global npm@11.6.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm lint:workflows
      - run: pnpm scan:secrets
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:packages
      - run: pnpm build
      - run: pnpm release:preflight
      - run: pnpm --filter @prosewire/web exec playwright install --with-deps chromium
      - run: pnpm test:acceptance
      - name: Detect an idempotent rerun
        id: registry
        run: |
          missing=0
          total=0
          while IFS= read -r package_spec; do
            total=$((total + 1))
            if npm view "$package_spec" version --json >/dev/null 2>&1; then
              echo "$package_spec already exists."
            else
              echo "$package_spec needs publication."
              missing=$((missing + 1))
            fi
          done < <(node -e '
            const fs = require("node:fs");
            for (const directory of process.env.PUBLIC_PACKAGE_DIRECTORIES.split(/\s+/)) {
              const manifest = JSON.parse(fs.readFileSync("packages/" + directory + "/package.json"));
              console.log(manifest.name + "@" + manifest.version);
            }
          ')
          if [ "$missing" -eq 0 ]; then
            echo "All $total public package versions already exist; publication is a no-op."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$missing of $total public package versions need publication."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.already_published != 'true'
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm release
      - name: Verify registry versions
        run: |
          for _attempt in {1..12}; do
            ready=true
            while IFS= read -r package_spec; do
              actual="$(npm view "$package_spec" version 2>/dev/null || true)"
              expected="${package_spec##*@}"
              if [ "$actual" != "$expected" ]; then
                ready=false
              fi
            done < <(node -e '
              const fs = require("node:fs");
              for (const directory of process.env.PUBLIC_PACKAGE_DIRECTORIES.split(/\s+/)) {
                const manifest = JSON.parse(fs.readFileSync("packages/" + directory + "/package.json"));
                console.log(manifest.name + "@" + manifest.version);
              }
            ')
            if [ "$ready" = true ]; then
              echo "Verified all public package versions on npm."
              exit 0
            fi
            sleep 5
          done
          echo "Public package versions were not consistently visible on npm" >&2
          exit 1
