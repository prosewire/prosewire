name: Release packages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    name: Prepare or publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # Push a version branch or published package tags.
      id-token: write # Authenticate to npm through trusted publishing.
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Prepare package versions and verify release inputs
        id: version
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          echo "start_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          changesets="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)"
          if [ -n "$changesets" ]; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
            pnpm version-packages
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          fi
          pnpm release:preflight
      - name: Push generated versions for pull request review
        if: steps.version.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          START_SHA: ${{ steps.version.outputs.start_sha }}
        run: |
          git add -A .changeset packages
          if git diff --cached --quiet; then
            echo "Versioning produced no tracked changes." >&2
            exit 1
          fi
          git config user.name "prosewire-release[bot]"
          git config user.email "prosewire-release[bot]@users.noreply.github.com"
          git commit -m "chore(release): version packages"
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$START_SHA"
          gh auth setup-git
          release_branch="release/packages-$START_SHA"
          if git ls-remote --exit-code origin "refs/heads/$release_branch" >/dev/null; then
            echo "The prepared branch $release_branch already exists; review it before preparing again." >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$release_branch"
          {
            echo '## Package versions prepared'
            echo
            echo "Branch: \`$release_branch\`"
            echo
            echo "[Review the version changes](https://github.com/$GITHUB_REPOSITORY/compare/main...$release_branch?expand=1)."
            echo
            echo 'Open and merge a pull request for this branch, then dispatch Release packages again on main to publish. This preparation run does not publish packages.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish packages
        if: steps.version.outputs.prepared == 'false'
        id: changesets
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          script: pnpm release
          create-github-releases: true
          push-git-tags: true
      - name: Verify published packages
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: pnpm verify:registry
      - name: Verify package tags and GitHub releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          git fetch origin --tags
          release_commit="$(git rev-parse HEAD)"
          while IFS=$'\t' read -r package_name package_version; do
            tag="$package_name@$package_version"
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [ "$tagged_commit" != "$release_commit" ]; then
              echo "$tag points to $tagged_commit, expected $release_commit" >&2
              exit 1
            fi
            release_tag="$(gh release view "$tag" --json tagName --jq .tagName)"
            test "$release_tag" = "$tag"
            release_url="$(gh release view "$tag" --json url --jq .url)"
            echo "- [$tag]($release_url)" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | [.name, .version] | @tsv' <<<"$PUBLISHED_PACKAGES")
      - name: Require at least one publication
        if: steps.version.outputs.prepared == 'false' && steps.changesets.outputs.published != 'true'
        run: |
          echo "Changesets did not publish any packages." >&2
          exit 1
