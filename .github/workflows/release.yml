name: Release packages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # Commit generated versions directly to main.
      id-token: write # Authenticate to npm through trusted publishing.
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Generate package versions
        id: version
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          echo "start_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          changesets="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)"
          if [ -z "$changesets" ]; then
            echo "No pending Changesets to release." >&2
            exit 1
          fi
          pnpm version-packages
          pnpm release:preflight
      - name: Commit generated versions to main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          START_SHA: ${{ steps.version.outputs.start_sha }}
        run: |
          git add -A .changeset packages
          if git diff --cached --quiet; then
            echo "Versioning produced no tracked changes." >&2
            exit 1
          fi
          git config user.name "prosewire-release[bot]"
          git config user.email "prosewire-release[bot]@users.noreply.github.com"
          git commit -m "chore(release): version packages"
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$START_SHA"
          gh auth setup-git
          git push origin HEAD:main
      - name: Publish packages
        id: changesets
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          script: pnpm release
          create-github-releases: true
          push-git-tags: true
      - name: Verify published packages
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: pnpm verify:registry
      - name: Verify package tags and GitHub releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          git fetch origin --tags
          release_commit="$(git rev-parse HEAD)"
          while IFS=$'\t' read -r package_name package_version; do
            tag="$package_name@$package_version"
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [ "$tagged_commit" != "$release_commit" ]; then
              echo "$tag points to $tagged_commit, expected $release_commit" >&2
              exit 1
            fi
            release_tag="$(gh release view "$tag" --json tagName --jq .tagName)"
            test "$release_tag" = "$tag"
            release_url="$(gh release view "$tag" --json url --jq .url)"
            echo "- [$tag]($release_url)" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | [.name, .version] | @tsv' <<<"$PUBLISHED_PACKAGES")
      - name: Require at least one publication
        if: steps.changesets.outputs.published != 'true'
        run: |
          echo "Changesets did not publish any packages." >&2
          exit 1
