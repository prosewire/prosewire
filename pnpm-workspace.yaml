packages:
  - "apps/*"
  - "packages/*"

engineStrict: false

allowBuilds:
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.3'
  - '@astrojs/react@6.0.3'
  - fumadocs-core@16.14.5
  - fumadocs-ui@16.14.5
